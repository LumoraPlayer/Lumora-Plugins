name: Build APKs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  torrentplugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torrentplugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/torrentplugin.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: torrentplugin
          path: torrentplugin/app/build/outputs/apk/release/torrentplugin.apk
          compression-level: 0

  redditscan:
