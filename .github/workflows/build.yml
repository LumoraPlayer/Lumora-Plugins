name: Build APKs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  torrentplugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torrentplugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: torrentplugin-debug
          path: torrentplugin/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

  redditscan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redditscan
    steps:
