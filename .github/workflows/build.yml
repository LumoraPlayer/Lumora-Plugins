name: Check plugin scripts

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check each script parses as valid JavaScript
        run: |
          for f in scripts/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
